name: Test & Build
on:
  pull_request:
  push:
    branches: [main, development, development/public-access-mcp, claude/manus-migration-independent-*]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: suppley_calc_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/suppley_calc_test
      TEST_DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/suppley_calc_test
      JWT_SECRET: ci-only-signing-key-at-least-32-characters
      MCP_ENABLED: 'false'
      MCP_AUTHORIZATION_REVIEWED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize disposable test schema
        run: pnpm exec drizzle-kit push --force
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/suppley-browser --no-save playwright@1.56.1
          /tmp/suppley-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Public portal desktop and mobile smoke
        run: node scripts/public-portal-smoke.mjs
        env:
          SUPPLEY_PLAYWRIGHT_DIR: /tmp/suppley-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portal-screenshots
          path: artifacts/public-portal/
          if-no-files-found: ignore
