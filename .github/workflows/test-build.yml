name: Test & Build
on:
  pull_request:
  push:
    branches: [main, development, development/public-access-mcp, release/public-chat, release/landing-excambia-2026-11-21, claude/manus-migration-independent-*]
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production Docker image
        run: docker build --tag suppley-ci:${{ github.sha }} .
      - name: Smoke test isolated application container
        run: |
          docker run -d --name suppley-ci --network none \
            -e JWT_SECRET=0123456789abcdef0123456789abcdef \
            suppley-ci:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if docker exec suppley-ci node --input-type=module -e 'const r = await fetch("http://localhost:3000/health"); const b = await r.json(); if (!r.ok || b.status !== "ok") process.exit(1);'; then
              docker exec suppley-ci sh -c 'test "$(id -u)" = 1337'
              exit 0
            fi
            sleep 2
          done
          docker logs suppley-ci
          exit 1
      - name: Remove isolated CI container
        if: always()
        run: docker rm -f suppley-ci || true

  test-and-build:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: suppley_calc_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/suppley_calc_test
      TEST_DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/suppley_calc_test
      JWT_SECRET: ci-only-signing-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize disposable test schema
        run: pnpm exec drizzle-kit push --force
      - run: pnpm check
      - name: Prepare isolated migration test runtime
        run: docker pull mysql:8.4
      - name: Run tests including isolated MySQL migration history
        run: pnpm test
        env:
          RUN_MIGRATIONS_MYSQL: '1'
      - run: pnpm build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/suppley-browser --no-save playwright@1.56.1
          /tmp/suppley-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Public portal desktop and mobile smoke
        run: node scripts/public-portal-smoke.mjs
        env:
          SUPPLEY_PLAYWRIGHT_DIR: /tmp/suppley-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portal-screenshots
          path: artifacts/public-portal/
          if-no-files-found: ignore
